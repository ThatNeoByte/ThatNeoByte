<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
    <link rel="stylesheet" href="style.css">

    <title>ThatNeoByte</title>
  </head>
  <body>
    <!-- Theme toggle button -->
    <button class="theme-toggle" aria-label="Toggle theme">
      <svg class="icon" aria-hidden="true">
        <use href="assets/feather-sprite.svg#moon"></use>
      </svg>
    </button>

    <!-- Main content -->
    <main>
      <div class="header">
        <img src="assets/profile.webp" alt="Profile picture" >
        <h1>NeoByte</h1>
        <div class="handle">@ThatNeoByte</div>
      </div>

      <div class="intro">
        <p>
          I'm a 19-year-old student software engineer from the Netherlands.
        </p>

        <p>
          I enjoy creating software, scripts, and automation. I'm also into
          homelabbing and self-hosting my own services.
        </p>
      </div>

      <div class="about">
        <ul>
          <li class="age">
            <svg class="icon" aria-hidden="true"><use href="assets/feather-sprite.svg#calendar"></use></svg> 
            <span>19 y/o</span>
          </li>
          <li class="pronouns">
            <svg class="icon" aria-hidden="true"><use href="assets/feather-sprite.svg#tag"></use></svg>
            <span>He/Him</span>
          </li>
          <li class="occupation">
            <svg class="icon" aria-hidden="true"><use href="assets/feather-sprite.svg#briefcase"></use></svg>
            <span>Software Engineer</span>
          </li>
          <li class="location">
            <svg class="icon" aria-hidden="true"><use href="assets/feather-sprite.svg#map-pin"></use></svg>
            <span>Netherlands</span>
          </li>
        </ul>
      </div>

      <div class="links">
        <a class="github" href="https://github.com/ThatNeoByte" title="GitHub Profile" >
          <svg class="icon" aria-hidden="true"><use href="assets/feather-sprite.svg#github"></use></svg>
          <span>GitHub</span>
        </a><br>
        <a class="discord" href="https://discord.com/users/371350209160019970" title="Discord Profile" >
          <svg class="icon" aria-hidden="true"><use href="assets/discord.svg#logo"></use></svg>
          <span>Discord</span>
        </a><br>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
